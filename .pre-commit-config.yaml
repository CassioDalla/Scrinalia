# Install once per clone with: uv run pre-commit install
# Run against every file with:  uv run pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright (type check)
        entry: uv run basedpyright
        language: system
        pass_filenames: false
