# The project name is pinned, and it must stay pinned. Compose derives it from the directory name
# by default and prefixes the named volumes with it, so renaming the checkout silently created
# **empty** ``pgdata``/``minio_data`` volumes: the collection was still on disk, in
# ``<old-directory>_pgdata``, and the UI showed nothing. Pinning it makes the volume names depend
# on this file instead of on where someone happened to clone the repository.
name: scrinalia

services:
  db:
    build:
      context: ./docker/postgres
    image: scrinalia-postgres:15
    container_name: scrinalia_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASS:-admin123}
      POSTGRES_DB: ${DB_NAME:-memoriacuritibana}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: minio_storage
    ports:
      - "9000:9000" # Porta da API S3
      - "9001:9001" # Porta do Painel Web
    environment:
      MINIO_ROOT_USER: "admin_minio"
      MINIO_ROOT_PASSWORD: "password_super_segura"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  pgdata:
  minio_data: