# Dependabot: the update PRs, and what each ecosystem covers.
#
# Three ecosystems are configured. The third — the SPA's `bun.lock` — is the `bun` entry: Dependabot
# supports the text lockfile (Bun >= 1.1.39) for version updates against `dev`, so a version PR
# carries `package.json` and `bun.lock` together — the thing an `npm` entry could not do, and what
# `--frozen-lockfile` in CI requires. It does **not** offer security updates for Bun, so an advisory
# in the front-end lock reaches the project through the `Dependency advisories` job in `ci.yml`.
version: 2

updates:
  # The ecosystems carry `target-branch: dev`, because `dev` is the integration branch and `main`
  # only moves at a release. With the version updates arriving on `main`, `dev` stops being "the next
  # release" and has to be fast-forwarded — measured: it fell behind and needed one. `target-branch`
  # is a version-updates option: security updates use the default branch, and Bun has none at all.
  #
  # The actions pinned by SHA in `.github/workflows/` never update themselves: pinning is what makes
  # a compromised tag unable to run, and Dependabot is what makes the pins move forward instead of
  # rotting. One grouped PR a week, not one per action.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]

  # Python. Dependabot understands `uv.lock`, so the PR it opens moves the lockfile too — which is
  # the whole point: a dependency bump that only edits `pyproject.toml` would fail `uv sync --locked`
  # in CI.
  #
  # `update-types` keeps the group to minor and patch on purpose. A dependency that does not match
  # the rule is still updated, in its own pull request, so a major is not hidden — it is separated.
  # Measured: with `patterns: ["*"]` alone, one PR carried pandas 3, SQLAlchemy 2.1 and transformers
  # 5.18 together, failed the type check before the suite ran, and hid a driver change that broke
  # every database connection. A major is a decision, and a decision deserves its own PR.
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The SPA's lock. One entry at the root, because `apps/*` is a workspace of the single `bun.lock`
  # Dependabot reads here. The group stays minor and patch for the same reason as Python — a major
  # deserves its own PR.
  - package-ecosystem: "bun"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # TypeScript 7 is the native port and it does not ship the compiler API: importing
    # `typescript` resolves to `lib/version.cjs`, so `ts.factory` and `ts.SyntaxKind` are gone.
    # typescript-eslint 8 refuses 7.0 at load time — support is tracked for the new 7.1 API — and
    # openapi-typescript 7.13 declares `typescript ^5.x`. Measured on #294: the bump broke codegen
    # (`ts.factory` undefined), lint (the typescript-eslint guard) and `tsc` (`baseUrl` removed); the
    # SPA's own sources did type-check under 7 once `paths` stopped depending on `baseUrl`. The major
    # stays out until the tools import the 7.1 API; then delete this rule and let the bot open the PR
    # again.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
