# Dependabot: the update PRs, and what is deliberately not listed.
#
# Two ecosystems are configured. The third — the SPA's `bun.lock` — is **not**, and that is a
# decision rather than an oversight: an `npm` entry would open pull requests that change
# `package.json` without touching `bun.lock`, and CI installs with `--frozen-lockfile`, so every one
# of them would fail. The front needs an updater that reads `bun.lock` (Renovate does; Dependabot's
# support for it is still partial) — recorded in `TODO.md` as the remaining step.
version: 2

updates:
  # Both ecosystems carry `target-branch: dev`, because `dev` is the integration branch and `main`
  # only moves at a release. With the version updates arriving on `main`, `dev` stops being "the next
  # release" and has to be fast-forwarded — measured: it fell behind and needed one. The option is
  # version-updates only, and security updates always use the default branch, so an urgent fix is not
  # delayed by the cycle.
  #
  # The actions pinned by SHA in `.github/workflows/` never update themselves: pinning is what makes
  # a compromised tag unable to run, and Dependabot is what makes the pins move forward instead of
  # rotting. One grouped PR a week, not one per action.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]

  # Python. Dependabot understands `uv.lock`, so the PR it opens moves the lockfile too — which is
  # the whole point: a dependency bump that only edits `pyproject.toml` would fail `uv sync --locked`
  # in CI.
  #
  # `update-types` keeps the group to minor and patch on purpose. A dependency that does not match
  # the rule is still updated, in its own pull request, so a major is not hidden — it is separated.
  # Measured: with `patterns: ["*"]` alone, one PR carried pandas 3, SQLAlchemy 2.1 and transformers
  # 5.18 together, failed the type check before the suite ran, and hid a driver change that broke
  # every database connection. A major is a decision, and a decision deserves its own PR.
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
