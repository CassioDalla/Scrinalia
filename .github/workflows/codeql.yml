name: CodeQL

# The only scanner here that follows the data instead of the dependency list: it can see a value
# coming from a request and reaching a query, which a version-based audit cannot. It runs on the pull
# request (so a finding arrives before the merge), on `main`, and weekly — a query pack improves
# without the code changing, and a weekly run is what notices that.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "23 4 * * 1"

# Least privilege at the workflow level; the job widens it only for what the upload requires.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Code scanning needs a public repository, or GitHub Advanced Security on a private one. Without
    # either, the analysis runs to completion and the **upload** is refused, so the job goes red for a
    # reason that has nothing to do with the code. The condition is written ``!= true`` and not
    # ``== false`` on purpose: a payload without the field (a scheduled run, if GitHub ever stops
    # sending it) **runs** the scan, so the weekly check can never be lost in silence — it would fail
    # loudly instead. Until the repository is public, ``gitleaks`` and the dependency audit are the
    # security gates, and both run.
    if: github.event.repository.private != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # ``security-events: write`` is how the results reach the Security tab; ``packages: read`` is
      # how the action pulls the query packs. Both are required by CodeQL and by nothing else.
      security-events: write # upload the analysis to the Security tab
      packages: read # pull the CodeQL query packs
      actions: read # read the workflow run metadata CodeQL attaches to the results
      contents: read # read the repository being analysed
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # The default pack finds security bugs; this one adds the correctness queries, which is
          # where "the value is used before it is validated" lives.
          queries: security-and-quality
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
