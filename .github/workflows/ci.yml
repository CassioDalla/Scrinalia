name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Least privilege by default. A workflow that only reads the repository should not carry a token that
# can write to it, and a third-party action that turns malicious cannot escalate what it was not given.
permissions:
  contents: read

# One run per branch/PR: a force-push cancels the previous run instead of leaving two racing, which on
# a repository being opened to the world is also the cheapest way to absorb a flood of pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ``persist-credentials: false``: the default leaves the GITHUB_TOKEN in the checkout's git
      # config, where any later step could read it. Nothing in this workflow pushes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Run ruff (lint)
        run: uvx ruff@0.16.10 check .
      - name: Run ruff (format check)
        run: uvx ruff@0.16.10 format --check .

  test:
    name: Migrations & tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Same image as docker-compose.test.yml: the migrations need the pgvector
        # extension, which the stock postgres image does not ship.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: test_user
      DB_PASS: test_password
      DB_NAME: test_db
      TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        # ``--locked``: the committed ``uv.lock`` is the contract, and a dependency that would change
        # the resolution fails the build instead of silently producing a different environment than the
        # one every developer and installer gets.
        run: uv sync --locked
      - name: Check the OpenAPI contract is up to date
        # The front-end client is generated from packages/api-contract/openapi.json, so a route or a
        # schema change that does not regenerate the contract would only fail in the browser. This
        # turns it into a build failure, which is the entire reason the contract is committed.
        run: |
          uv run python -m scrinalia.api.dump_openapi > /tmp/openapi.json
          if ! diff -u packages/api-contract/openapi.json /tmp/openapi.json; then
            echo "::error::packages/api-contract/openapi.json está desatualizado. Rode: uv run python -m scrinalia.api.dump_openapi > packages/api-contract/openapi.json && bun run --cwd apps/curator codegen"
            exit 1
          fi
      - name: Type check
        run: uv run basedpyright
      - name: Apply migrations on a fresh database
        run: uv run alembic upgrade head
      - name: Check for model/migration drift
        run: uv run alembic check
      - name: Run tests
        run: uv run pytest

  frontend:
    name: Curator UI (types, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check the generated API client is up to date
        # ``schema.d.ts`` is committed so the build never depends on the Python app, but it must be
        # regenerated whenever ``openapi.json`` moves. Regenerating here and comparing is what keeps
        # a hand-written ``fetch`` from creeping in unnoticed.
        run: |
          bun run --cwd apps/curator codegen
          if ! git diff --exit-code -- apps/curator/src/api/schema.d.ts; then
            echo "::error::apps/curator/src/api/schema.d.ts está desatualizado. Rode 'bun run --cwd apps/curator codegen' e faça o commit."
            exit 1
          fi
      - name: Type check
        run: bun run --cwd apps/curator typecheck
      - name: Lint
        run: bun run --cwd apps/curator lint
      - name: Build
        run: bun run --cwd apps/curator build
