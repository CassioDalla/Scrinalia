name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ruff (lint)
        run: uvx ruff@0.16.10 check .
      - name: Run ruff (format check)
        run: uvx ruff@0.16.10 format --check .

  test:
    name: Migrations & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: test_user
      DB_PASS: test_password
      DB_NAME: test_db
      TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Apply migrations on a fresh database
        run: uv run alembic upgrade head
      - name: Check for model/migration drift
        run: uv run alembic check
      - name: Run tests
        run: uv run pytest
