name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ruff (lint)
        run: uvx ruff@0.16.10 check .
      - name: Run ruff (format check)
        run: uvx ruff@0.16.10 format --check .

  test:
    name: Migrations & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as docker-compose.test.yml: the migrations need the pgvector
        # extension, which the stock postgres image does not ship.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: test_user
      DB_PASS: test_password
      DB_NAME: test_db
      TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Check the OpenAPI contract is up to date
        # The front-end client is generated from packages/api-contract/openapi.json, so a route or a
        # schema change that does not regenerate the contract would only fail in the browser. This
        # turns it into a build failure, which is the entire reason the contract is committed.
        run: |
          uv run python -m memoria_curitibana.api.dump_openapi > /tmp/openapi.json
          if ! diff -u packages/api-contract/openapi.json /tmp/openapi.json; then
            echo "::error::packages/api-contract/openapi.json está desatualizado. Rode: uv run python -m memoria_curitibana.api.dump_openapi > packages/api-contract/openapi.json && bun run --cwd apps/curator codegen"
            exit 1
          fi
      - name: Type check
        run: uv run basedpyright
      - name: Apply migrations on a fresh database
        run: uv run alembic upgrade head
      - name: Check for model/migration drift
        run: uv run alembic check
      - name: Run tests
        run: uv run pytest

  frontend:
    name: Curator UI (types, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check the generated API client is up to date
        # ``schema.d.ts`` is committed so the build never depends on the Python app, but it must be
        # regenerated whenever ``openapi.json`` moves. Regenerating here and comparing is what keeps
        # a hand-written ``fetch`` from creeping in unnoticed.
        run: |
          bun run --cwd apps/curator codegen
          if ! git diff --exit-code -- apps/curator/src/api/schema.d.ts; then
            echo "::error::apps/curator/src/api/schema.d.ts está desatualizado. Rode 'bun run --cwd apps/curator codegen' e faça o commit."
            exit 1
          fi
      - name: Type check
        run: bun run --cwd apps/curator typecheck
      - name: Lint
        run: bun run --cwd apps/curator lint
      - name: Build
        run: bun run --cwd apps/curator build
